---
- name: Create Alloy user and directories
  ansible.builtin.user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: [adm, systemd-journal]
    append: true

- name: Install Alloy archive dependency
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Create Alloy configuration directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    owner: alloy
    group: alloy
    mode: '0755'

- name: Create Alloy data directory
  ansible.builtin.file:
    path: /var/lib/alloy
    state: directory
    owner: alloy
    group: alloy
    mode: '0755'

- name: Create Alloy controller download cache
  ansible.builtin.file:
    path: "{{ alloy_controller_cache_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when: alloy_download_on_controller | bool

- name: Download Alloy archive on the controller
  ansible.builtin.get_url:
    url: "{{ alloy_download_url }}"
    dest: "{{ alloy_controller_archive_path }}"
    checksum: "{{ alloy_checksum }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  when: alloy_download_on_controller | bool

- name: Verify Alloy archive is available on the controller
  ansible.builtin.stat:
    path: "{{ alloy_controller_archive_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: alloy_archive
  failed_when: not alloy_archive.stat.exists

- name: Install Alloy binary
  ansible.builtin.unarchive:
    src: "{{ alloy_controller_archive_path }}"
    dest: /usr/local/bin
    creates: "/usr/local/bin/alloy-linux-{{ alloy_arch }}"

- name: Create stable Alloy executable path
  ansible.builtin.file:
    src: "/usr/local/bin/alloy-linux-{{ alloy_arch }}"
    dest: /usr/local/bin/alloy
    state: link
    force: true

- name: Install Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: alloy
    group: alloy
    mode: '0640'
  notify: restart alloy

- name: Install Alloy service
  ansible.builtin.template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    mode: '0644'
  notify: restart alloy

- name: Enable Alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
