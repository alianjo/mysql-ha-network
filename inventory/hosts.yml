---
all:
  vars:
    ansible_user: ubuntu
    # All managed hosts expose SSH on the dedicated deployment port.
    ansible_port: 2222
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:

    mysql:
      children:
        mysql_primary:
        mysql_replica:

    mysql_primary:
      hosts:
        tabriz-mysql01:
          ansible_host: 45.159.113.191
          public_ip: 45.159.113.191
          ansible_user: root
          private_ip: 10.0.0.1
          site: tabriz
          role: mysql_primary

    mysql_replica:
      hosts:
        shiraz-mysql01:
          ansible_host: 85.208.254.172
          ansible_user: root
          public_ip: 85.208.254.172
          private_ip: REPLACE_ME_SHIRAZ_MYSQL01_PRIVATE_IP
          site: shiraz
          role: mysql_replica

    tabriz:
      hosts:
        tabriz-mysql01:
        tabriz-wg01:

    shiraz:
      hosts:
        shiraz-mysql01:
        shiraz-wg02:

    wireguard:
      hosts:
        tabriz-mysql01:
        tabriz-wg01:
        shiraz-wg02:
        shiraz-mysql01:

    transit_routers:
      hosts:
        tabriz-wg01:
        shiraz-wg02:

    routing:
      hosts:
        tabriz-mysql01:
        tabriz-wg01:
        shiraz-wg02:
        shiraz-mysql01:

    monitoring:
      hosts:
        monitor-01:

  hosts:

    tabriz-wg01:
      ansible_host: 45.159.113.190
      public_ip: 45.159.113.190
      ansible_user: root
      private_ip: REPLACE_ME_TABRIZ_WG01_PRIVATE_IP
      site: tabriz
      role: primary_transit_router

    shiraz-wg02:
      ansible_host: 185.213.165.112
      public_ip: 185.213.165.112
      ansible_user: root
      private_ip: REPLACE_ME_SHIRAZ_WG02_PRIVATE_IP
      site: shiraz
      role: backup_transit_router

    monitor-01:
      ansible_host: 85.208.254.233
      public_ip: 85.208.254.233
      ansible_user: root
      site: observability
      role: monitoring
