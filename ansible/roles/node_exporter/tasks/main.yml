---
- name: Create node exporter account and directories
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create node exporter directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: '0755'
  loop:
    - "{{ node_exporter_textfile_dir }}"
    - /etc/node_exporter

- name: Create node exporter controller download cache
  ansible.builtin.file:
    path: "{{ node_exporter_controller_cache_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true
  when: node_exporter_download_on_controller | bool

- name: Download node exporter archive on the controller
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_controller_archive_path }}"
    checksum: "{{ node_exporter_checksum }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  when: node_exporter_download_on_controller | bool

- name: Verify node exporter archive is available on the controller
  ansible.builtin.stat:
    path: "{{ node_exporter_controller_archive_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: node_exporter_archive
  failed_when: not node_exporter_archive.stat.exists

- name: Install node exporter binary
  ansible.builtin.unarchive:
    src: "{{ node_exporter_controller_archive_path }}"
    dest: /tmp
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"

- name: Copy node exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: restart node exporter

- name: Install node exporter service
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node-exporter.service
    mode: '0644'
  notify: restart node exporter

- name: Install network and routing collector
  ansible.builtin.template:
    src: sre-network-metrics.sh.j2
    dest: /usr/local/bin/sre-network-metrics
    mode: '0755'

- name: Install custom collector service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: '0644'
  loop:
    - {src: sre-network-metrics.service.j2, dest: sre-network-metrics.service}
    - {src: sre-network-metrics.timer.j2, dest: sre-network-metrics.timer}
  notify: restart custom metrics

- name: Run custom collector periodically
  ansible.builtin.systemd:
    name: sre-network-metrics.service
    state: started
    daemon_reload: true

- name: Enable node exporter and custom collector timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [node-exporter.service, sre-network-metrics.timer]
