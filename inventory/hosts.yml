---
all:
  vars:
    ansible_user: ubuntu
    # All managed hosts expose SSH on the dedicated deployment port.
    ansible_port: 2222
    ansible_python_interpreter: /usr/bin/python3

  children:

    mysql:
      children:
        mysql_primary:
        mysql_replica:

    mysql_primary:
      hosts:
        tabriz-mysql01:
          ansible_host: 95.38.181.171
          public_ip: 95.38.181.171
          ansible_user: root
          private_ip: 10.0.0.1
          site: tabriz
          role: mysql_primary

    mysql_replica:
      hosts:
        shiraz-mysql01:
          ansible_host: 95.38.181.204
          ansible_user: root
          public_ip: 95.38.181.204
          site: shiraz
          role: mysql_replica

    tabriz:
      hosts:
        tabriz-mysql01:
        tabriz-wg01:

    shiraz:
      hosts:
        shiraz-mysql01:
        shiraz-wg02:

    wireguard:
      hosts:
        tabriz-mysql01:
        tabriz-wg01:
        shiraz-wg02:
        shiraz-mysql01:

    transit_routers:
      hosts:
        tabriz-wg01:
        shiraz-wg02:

    routing:
      hosts:
        tabriz-mysql01:
        tabriz-wg01:
        shiraz-wg02:
        shiraz-mysql01:

    monitoring:
      hosts:
        monitor-01:

  hosts:

    tabriz-wg01:
      ansible_host: 95.38.180.108
      public_ip: 95.38.180.108
      ansible_user: root
      site: tabriz
      role: primary_transit_router

    shiraz-wg02:
      ansible_host: 37.32.7.100
      public_ip: 37.32.7.100
      ansible_user: root
      site: shiraz
      role: backup_transit_router

    monitor-01:
      ansible_host: 37.32.6.14
      public_ip: 37.32.6.14
      ansible_user: root
      site: observability
      role: monitoring
